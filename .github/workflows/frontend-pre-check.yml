name: frontend-pre-check

# AI pre-check of every pull request: an isolated
# reviewer reads the diff against gi-tech-standards and this repository's
# README, comments on real findings and posts one "Pre-check" summary of the
# technical decisions. The workflow, the reviewer's instructions and the
# process live in gi-org-pl/frontend-workflows
# (docs/pre-check/PROCESS.md). A pull request that needs a person passes
# the check with a warning, because a ruleset on main requires an approval of
# the most recent push - that approval is the gate. A pull request it does
# not pre-check (fork, draft, bot, no secret) fails the check. It
# is advisory: a person still approves; automation reads the frontend-pre-check / review
# check of the head commit, never the label.
on:
  pull_request:
    # edited: the description carries the design comparison the reviewer
    # checks, and a new base branch changes the diff (see the job's if).
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  # A review derives the check of the head again from the stored result, with
  # no new review: an approval of the head turns "needs a person" green.
  pull_request_review:
    types: [submitted, dismissed, edited]
  # The merge queue needs every required check on its entries; the pre-check
  # passes there when the queued pull requests passed on their heads.
  merge_group:

permissions: {}

jobs:
  frontend-pre-check:
    name: frontend-pre-check
    # Of the pull request edits, only one of the description or of the base branch
    # counts, not the title; review events always run.
    # Skipped here, the run leaves the last frontend-pre-check / review result alone.
    if: github.event_name == 'pull_request_review' || github.event.action != 'edited' || github.event.changes.body != null || github.event.changes.base != null
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # The gate counts the pre-check runs of the last hour.
      actions: read
      # The review job reads the pull requests' checks for a merge queue entry.
      checks: read
    # A full commit SHA: the reusable workflow takes its scripts and the
    # reviewer's instructions from the same commit, so this pins all of it.
    # Bump it in a reviewed pull request to adopt a newer version.
    uses: gi-org-pl/frontend-workflows/.github/workflows/frontend-pre-check.yml@08a4fc357e1bd27fd889fad434e26ebc3806b142 # v2.1.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

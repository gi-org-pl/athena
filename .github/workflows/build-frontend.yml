name: frontend-ci

# Lint (Biome in its read-only CI mode), typecheck, unit tests, the library
# build and the Storybook build of every pull request into develop or main,
# and of every push to main: a run on main saves the dependency cache that
# every new pull request then starts from. The jobs live in
# gi-org-pl/frontend-workflows (docs/ci/CI.md); publishing stays in
# release.yml.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

# A newer push to a pull request replaces its running checks; runs on main
# are left to finish.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-ci:
    permissions:
      contents: read
      # The coverage comment on the pull request, from a job of its own that
      # runs no code of the pull request.
      pull-requests: write
    # A full commit SHA: the reusable workflow takes its setup and scripts
    # from the same commit, so this pins all of it. Bump it in a reviewed
    # pull request to adopt a newer version.
    uses: gi-org-pl/frontend-workflows/.github/workflows/frontend-ci.yml@61861793f41d502a0f5a6034ed16e4d55f4d0588 # pre-release, frontend-workflows#13
    with:
      lint_script: lint:ci
      build_artifact_path: dist
      storybook_script: storybook:build --quiet

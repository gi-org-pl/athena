name: pre-check

# AI pre-check of every pull request that is ready for review: an isolated
# reviewer reads the diff against gi-tech-standards and this repository's
# README, comments on real findings and posts one "Pre-check" summary of the
# technical decisions. The workflow, the reviewer's instructions and the
# process live in gi-tech-standards (docs/process/PRE_CHECK.md). Until the
# organisation secret CLAUDE_CODE_OAUTH_TOKEN exists, every run is skipped. It
# is advisory: a person still approves; automation reads the pre-check / review
# check of the head commit, never the label.
on:
  pull_request:
    # edited: the description carries the design comparison the reviewer
    # checks, and a new base branch changes the diff (see the job's if).
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  # The merge queue needs every required check on its entries; the pre-check
  # ends green there at once, because the pull request was checked already.
  merge_group:

permissions: {}

jobs:
  pre-check:
    name: pre-check
    # Only an edit of the description or a new base branch counts, not the title.
    # Skipped here, the run leaves the last pre-check / review result alone.
    if: github.event.action != 'edited' || github.event.changes.body != null || github.event.changes.base != null
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # The gate counts the pre-check runs of the last hour.
      actions: read
    # A full commit SHA: the reusable workflow takes its scripts and the
    # reviewer's instructions from the same commit, so this pins all of it.
    # Bump it in a reviewed pull request to adopt a newer version.
    uses: gi-org-pl/gi-tech-standards/.github/workflows/pre-check.yml@4dc31ff9ca1c89c881c9aef4a213a6427a4e0535 # gi-org-pl/gi-tech-standards#19
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

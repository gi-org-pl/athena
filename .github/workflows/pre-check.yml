name: pre-check

# AI pre-check of every pull request that is ready for review: an isolated
# reviewer reads the diff against gi-tech-standards and this repository's
# README, comments on real findings and posts one "Pre-check" summary of the
# technical decisions. The workflow, the reviewer's instructions and the
# process live in gi-tech-standards (docs/process/PRE_CHECK.md). Until the
# organisation secret CLAUDE_CODE_OAUTH_TOKEN exists, every run is skipped.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue needs every required check on its entries; the pre-check
  # ends green there at once, because the pull request was checked already.
  merge_group:

permissions: {}

jobs:
  pre-check:
    name: pre-check
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: gi-org-pl/gi-tech-standards/.github/workflows/pre-check.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
